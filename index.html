      </section>

      <!-- ================= EXPECTATIONS ================= -->
      <section class="page" id="page-expectations" data-title="Expectations">
        <h1 class="page-title">Model vs consumers vs markets</h1>
        <p class="lede">Three independent views of future inflation: this model, what households expect over the next year (University of Michigan survey), and what bond markets price in over the next ten years (10-year breakeven rate).</p>
        <div id="expBody"></div>
        ${pageFoot()}
      </section>

      <!-- ================= FED ================= -->
      <section class="page" id="page-fed" data-title="Fed & rates">
        <h1 class="page-title">The Fed's response</h1>
        <p class="lede">The Federal Reserve raises its policy rate to cool inflation and cuts it to support growth. The gap between the two, the real policy rate, shows how tight policy is.</p>
        <div id="fedBody"></div>
        ${pageFoot()}
      </section>

      <!-- ================= METHODOLOGY ================= -->
      <section class="page" id="page-methodology" data-title="Methodology">
        <h1 class="page-title">Methodology</h1>
        <p class="lede">How the data is prepared, how the model is chosen and evaluated, and where it falls short.</p>
        <div class="grid-2 method">
          <div class="card"><h3>Data</h3><p>Monthly CPI for All Urban Consumers (CPI-U, all items, seasonally adjusted; FRED <code>CPIAUCSL</code>). Inflation is the 12-month percent change of the index.
            BLS did not publish October 2025 CPI because of the federal government shutdown; that month is filled by linear interpolation so every year-over-year rate compares the same calendar month a year apart.</p></div>
          <div class="card"><h3>Models</h3><p>The published forecast comes from an ${esc(modelLabel)} model fit to the full year-over-year inflation series, projecting 12 months ahead with 95% confidence intervals.
            Its order was selected by comparing nine candidate ARIMA specifications on out-of-sample error rather than in-sample fit.
            It is benchmarked against a naive "no change" forecast, an ARIMAX model that adds last month's energy and core inflation, and a gradient-boosted tree model (scikit-learn) using lags of headline, core, energy and monthly CPI.</p></div>
          <div class="card"><h3>Evaluation</h3><ul>
            <li>Rolling-origin backtest over the last 24 months, expanding training window, one-step-ahead forecasts.</li>
            <li>MAE and RMSE in percentage points, against a naive "no change" benchmark.</li>
            <li>Per-month errors are published so accuracy can be checked for stability, not just on average.</li>
            <li>A second backtest scores 1- to 12-month-ahead forecasts and checks whether the 95% intervals really cover 95% of outcomes.</li>
            <li>Model differences are tested with the Diebold-Mariano test (squared-error loss, Harvey-Leybourne-Newbold small-sample correction).</li>
            <li>Every live forecast is archived and scored when the actual CPI print arrives.</li></ul></div>
          <div class="card"><h3>Pipeline &amp; limitations</h3>
            <p>A GitHub Actions job checks FRED daily and re-runs the models when a new CPI release lands.</p>
            <div class="pipeline"><span class="step">FRED</span><span class="arrow">→</span><span class="step">Python · pandas · statsmodels · scikit-learn</span><span class="arrow">→</span><span class="step">CSV</span><span class="arrow">→</span><span class="step">This site</span></div>
            <p style="margin-top:10px">Univariate ARIMA uses only past inflation. It does not see energy prices, wages or policy, and tends to lag turning points.</p></div>
        </div>
        <h2>Data sources</h2>
        <div class="card"><table>
          <thead><tr><th>Series</th><th>FRED ID</th><th>Source</th></tr></thead>
          <tbody>
            ${[['CPI, all items','CPIAUCSL','BLS'],['CPI less food & energy (core)','CPILFESL','BLS'],['CPI food','CPIUFDSL','BLS'],['CPI energy','CPIENGSL','BLS'],['CPI shelter','CUSR0000SAH1','BLS'],
               ['Average prices: eggs, gasoline, milk, coffee, bread','APU0000708111, APU000074714, APU0000709112, APU0000717311, APU0000702111','BLS'],
               ['Average hourly earnings, production & nonsupervisory','AHETPI','BLS'],['Effective federal funds rate','FEDFUNDS','Federal Reserve'],
               ['Expected inflation, next 12 months','MICH','University of Michigan'],['10-year breakeven inflation rate','T10YIE','Federal Reserve Bank of St. Louis']]
              .map(r=>`<tr><td>${r[0]}</td><td>${r[1].split(', ').map(id=>`<a href="https://fred.stlouisfed.org/series/${id}" target="_blank" rel="noopener"><code>${id}</code></a>`).join(' ')}</td><td class="muted">${r[2]}</td></tr>`).join('')}
          </tbody></table></div>
        ${pageFoot()}
      </section>
    `;

    // =============== page renderers (charts drawn when a page becomes visible) ===============
    // chart height grows with width on large screens so wide charts don't look flat
    const H = (desk, mob) => W => W < 520 ? mob : Math.round(Math.min(desk*1.35, Math.max(desk, W*0.28)));
    const padN = n => Array(n).fill(null);

    // ---- overview chart ----
    let ovMonths = 36;
    function forecastCfg(hist){
      const lastA = hist[hist.length-1], nH = hist.length, nF = forecast.length;
      return {
        aria:'Year-over-year CPI inflation with 12-month forecast',
        height:H(380,280),
        dates: hist.map(d=>d.date).concat(forecast.map(f=>f.date)),
        series:[
          {label:'Actual', cls:'actual', values: hist.map(d=>d.yoy).concat(padN(nF)), endMarker:true, endLabel:'above'},
          {label:'Forecast', cls:'model', dashed:true, values: padN(nH-1).concat([lastA.yoy], forecast.map(f=>f.mean)), skipTipAt:i=>i===nH-1, endMarker:true, endLabel:'right'},
        ],
        endFmt:v=>v.toFixed(1)+'%',
        band:{lower: padN(nH-1).concat([lastA.yoy], forecast.map(f=>f.lo)), upper: padN(nH-1).concat([lastA.yoy], forecast.map(f=>f.hi)), label:'95% interval', skipTipAt:i=>i===nH-1},
        refs:[{value:FED_TARGET, label:'Fed target 2%'}],
        yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+'%',
      };
    }
    const ovEl = document.getElementById('ovChart');
    mount(ovEl, el=>lineChart(forecastCfg(ovMonths ? yoyData.slice(-ovMonths) : yoyData))(el));
    bindSeg('ovRange', v=>{ ovMonths=+v; ovEl.__draw(ovEl); });

    // ---- forecast page ----
    mount(document.getElementById('fcChart'), el=>lineChart(forecastCfg(yoyData.slice(-24)))(el));

    // ---- track record ----
    const callouts = document.getElementById('callouts');
    if(hasErrors){
      let wins=0; errModel.forEach((e,i)=>{ if(e.abs < errNaive[i].abs) wins++; });
      const worst = errModel.reduce((a,b)=>b.abs>a.abs?b:a);
      callouts.innerHTML = `
        <div class="kpi"><div class="kpi-label">Average miss (MAE)</div><div class="kpi-value num">${model.mae.toFixed(2)} <small>pp</small></div><div class="kpi-sub">Naive benchmark: ${naive.mae.toFixed(2)} pp</div></div>
        <div class="kpi"><div class="kpi-label">Beat the benchmark</div><div class="kpi-value num">${wins} <small>of ${errModel.length} months</small></div><div class="kpi-sub">Closer to the actual print than "no change"</div></div>
        <div class="kpi"><div class="kpi-label">Largest miss</div><div class="kpi-value num">${pp(worst.error,2)}</div><div class="kpi-sub">${fmtMonthLong(worst.date)}: forecast ${pct(worst.forecast,2)}, actual ${pct(worst.actual,2)}</div></div>`;
      mount(document.getElementById('errChart'), lineChart({
        aria:'Monthly forecast error', height:260, dates: errModel.map(e=>e.date),
        series:[{label:'Naive benchmark', cls:'ref', values: errNaive.map(e=>e.error)}, {label:modelLabel, cls:'model', values: errModel.map(e=>e.error)}],
        zeroLine:true, yFmt:(v,d)=>(v>0?'+':'')+v.toFixed(d), tipFmt:v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+' pp',
      }));
    } else if(model && naive){
      callouts.innerHTML = `
        <div class="kpi"><div class="kpi-label">Average miss (MAE)</div><div class="kpi-value num">${model.mae.toFixed(2)} <small>pp</small></div><div class="kpi-sub">${esc(modelLabel)}</div></div>
        <div class="kpi"><div class="kpi-label">Naive benchmark MAE</div><div class="kpi-value num">${naive.mae.toFixed(2)} <small>pp</small></div><div class="kpi-sub">"Next month = this month"</div></div>
        <div class="kpi"><div class="kpi-label">Improvement</div><div class="kpi-value num">${maeGain.toFixed(0)}%</div><div class="kpi-sub">Lower average error</div></div>`;
    }
    const sorted = bt.slice().sort((a,b)=>a.mae-b.mae), maxMae = Math.max(...sorted.map(r=>r.mae));
    document.getElementById('leaderboard').innerHTML = `<div class="hbars"><div class="hb-row wide hb-head"><span>Model</span><span></span><span class="hb-v">MAE</span><span class="hb-v hb-rmse">RMSE</span></div>` +
      sorted.map(r=>{
        const isM = model && r.model===model.model, isN = /naive/i.test(r.model);
        return `<div class="hb-row wide ${isM?'em':''}"><span class="hb-name">${esc(isN?'Naive benchmark':r.model.replace(/\s/g,''))}${isM?'<span class="tag">in use</span>':''}</span>
          <span class="hb-track"><span class="hb-bar pos ${isM?'c-model':isN?'c-ref':''}" style="left:0;width:${(r.mae/maxMae*100).toFixed(1)}%"></span></span>
          <span class="hb-v">${r.mae.toFixed(3)}</span><span class="hb-v hb-rmse">${r.rmse.toFixed(3)}</span></div>`;
      }).join('') + `</div>`;

    // ---- model competition + findings ----
    const bm = bmRaw.map(r=>({model:r.model, label:r.label, n:+r.n, mae:num(r.mae), rmse:num(r.rmse), vs:num(r.mae_vs_naive_pct), p:num(r.dm_pvalue), pA:num(r.dm_pvalue_vs_arima)})).filter(r=>r.mae!=null);
    const bmBy = Object.fromEntries(bm.map(r=>[r.model, r]));
    const fmtP = p => p==null ? '—' : p < 0.001 ? '< 0.001' : p.toFixed(3);
    const sigWord = p => p==null ? '' : p < 0.05 ? 'statistically significant at the 5% level' : p < 0.10 ? 'only weakly significant (10% level)' : 'not statistically significant';
    (function(){
      const card = document.getElementById('benchCard');
      if(!bm.length){ card.innerHTML = pending('The model competition'); return; }
      const maxM = Math.max(...bm.map(r=>r.mae));
      const rows = bm.slice().sort((a,b)=>a.mae-b.mae);
      card.innerHTML = `<p class="card-title">One-month-ahead accuracy, last ${bm[0].n} months</p>
        <p class="card-sub">Lower is better. p-values below 0.05 mean the difference from naive is unlikely to be luck.</p>
        <div style="overflow-x:auto"><table class="bm-table"><thead><tr><th>Model</th><th>MAE (pp)</th><th class="r">RMSE</th><th class="r">vs naive</th><th class="r">p-value</th></tr></thead><tbody>
        ${rows.map(r=>`<tr class="${r.model==='arima'?'em':''}"><td class="model">${esc(r.label)}${r.model==='arima'?'<span class="tag">in use</span>':''}</td>
          <td><span class="bm-bar ${r.model==='arima'?'c-model':r.model==='naive'?'c-ref':''}" style="width:${(r.mae/maxM*110).toFixed(0)}px"></span>${r.mae.toFixed(3)}</td>
          <td class="r">${r.rmse.toFixed(3)}</td><td class="r">${r.model==='naive'?'—':spct(r.vs)}</td><td class="r">${r.model==='naive'?'—':fmtP(r.p)}</td></tr>`).join('')}
        </tbody></table></div>`;
    })();

    (function(){
      const body = document.getElementById('findingsBody');
      const items = [];
      const A = bmBy.arima, N = bmBy.naive;
      // 1. beating naive
      if(A && N){
        const better = A.mae < N.mae;
        const sigA = A.p!=null && A.p<0.05;
        items.push({title: better && sigA ? `The model beats a "no change" forecast, but the margin is thin` : better ? `The model looks better than "no change", but not by more than luck` : `A "no change" forecast is hard to beat`,
          stat: `${esc(A.label)}: ${spct(A.vs)} error vs naive · p = ${fmtP(A.p)}`,
          text: `Over the last ${A.n} months, ${esc(A.label)} missed actual inflation by ${A.mae.toFixed(2)} points on average, against ${N.mae.toFixed(2)} for simply repeating last month's rate.
            The Diebold-Mariano test puts the difference at p = ${fmtP(A.p)}: ${sigWord(A.p)}. Month-to-month inflation is highly persistent, so most of the information is already in the latest print.`,
          link:'#track-record'});
      }
      // 2. more data / ML
      const X = bmBy.arimax, G = bmBy.gbm;
      if(A && (X || G)){
        const challengers = [X, G].filter(Boolean);
        const best = challengers.slice().sort((a,b)=>a.mae-b.mae)[0];
        const beats = best.mae < A.mae;
        const rel = m => ((m.mae/A.mae-1)*100);
        const sigB = best.pA!=null && best.pA<0.05;
        items.push({title: beats && sigB ? `${esc(best.label)} beats the simple model` : beats ? `${esc(best.label)} edges out ARIMA, but not by a meaningful margin` : 'More data and machine learning did not beat the simple model',
          stat: challengers.map(m=>`${esc(m.label)}: ${spct(rel(m))} vs ARIMA (p = ${fmtP(m.pA)})`).join(' · '),
          text: `Adding last month's energy and core inflation, or switching to gradient-boosted trees, ${beats ? `changed the average error by ${spct(rel(best))} for the best challenger` : 'did not lower the average error'}.
            ${best.pA!=null ? `Against ARIMA that difference is ${sigWord(best.pA)} (p = ${fmtP(best.pA)}).` : ''} With only a few hundred monthly observations and one dominant signal, extra complexity has little room to help.`,
          link:'#track-record'});
      }
      // 3. horizon
      const hz = hzRaw.map(r=>({h:+r.horizon, m:num(r.model_mae), nv:num(r.naive_mae), cov:num(r.coverage_95), n:+r.n})).filter(r=>r.m!=null).sort((a,b)=>a.h-b.h);
      if(hz.length){
        const f=hz[0], l=hz[hz.length-1], g = r => (1-r.m/r.nv)*100;
        items.push({title: g(l) > g(f) ? 'The model earns its keep at longer horizons' : 'The advantage does not grow with the horizon',
          stat: `${f.h}-month: ${g(f).toFixed(0)}% better than naive · ${l.h}-month: ${g(l).toFixed(0)}% better`,
          text: `One month ahead, the model's edge over naive is ${g(f).toFixed(0)}%. Twelve months ahead it is ${g(l).toFixed(0)}% (${l.m.toFixed(2)} vs ${l.nv.toFixed(2)} points), because the model pulls forecasts back toward the long-run average while "no change" keeps extrapolating today's rate.`,
          link:'#track-record'});
        const avgCov = hz.reduce((s,r)=>s+r.cov*r.n,0)/hz.reduce((s,r)=>s+r.n,0);
        items.push({title: Math.abs(avgCov-95) <= 4 ? 'The uncertainty bands are honest' : avgCov < 95 ? 'The uncertainty bands are too narrow' : 'The uncertainty bands are conservative',
          stat: `${avgCov.toFixed(0)}% of outcomes inside the 95% interval`,
          text: `Across all horizons, the actual inflation rate landed inside the model's 95% interval ${avgCov.toFixed(0)}% of the time. A forecast that states its uncertainty correctly is often more useful than a slightly sharper point estimate.`,
          link:'#forecast'});
      }
      // 5. turning points
      const eA = bmErrRaw.filter(r=>r.model==='arima').map(r=>({date:parseDate(r.date), err:num(r.error), actual:num(r.actual)}));
      if(eA.length){
        const worst = eA.reduce((a,b)=>Math.abs(b.err)>Math.abs(a.err)?b:a);
        const prevD = cpiAt.get(addMonths(worst.date,-1).getTime());
        const jump = prevD ? worst.actual - prevD.yoy : null;
        const same = bmErrRaw.filter(r=>r.date===isoDate(worst.date) && r.model!=='arima').map(r=>`${(bmBy[r.model]||{label:r.model}).label} ${pp(num(r.error),2)}`);
        const others = same.length ? ` The other models missed that month too: ${esc(same.join(', '))}.` : '';
        items.push({title:'Turning points are the weak spot',
          stat:`Largest miss: ${pp(worst.err,2)} in ${fmtMonth(worst.date)}`,
          text:`The biggest error came in ${fmtMonthLong(worst.date)}, when inflation ${jump!=null ? (jump>0?'jumped':'fell')+' '+Math.abs(jump).toFixed(2)+' points in a single month' : 'moved sharply'}. A model that only sees past inflation cannot anticipate shocks such as energy price spikes; it reacts a month late.${others}`,
          link:'#track-record'});
      }
      // 6. data quality
      const rawRows = cpiRaw.map(r=>({date:parseDate(r.date), cpi:num(r.cpi)})).filter(r=>r.cpi!=null).sort((a,b)=>a.date-b.date);
      let maxDiff = 0, diffAt = null;
      rawRows.forEach((r,i)=>{ if(i<12) return; const naiveYoY=(r.cpi/rawRows[i-12].cpi-1)*100; const d=cpiAt.get(r.date.getTime()); if(d && d.yoy!=null){ const diff=Math.abs(naiveYoY-d.yoy); if(diff>maxDiff){ maxDiff=diff; diffAt=r.date; } } });
      if(maxDiff > 0.05){
        items.push({title:'One missing month would have distorted a year of data',
          stat:`Up to ${maxDiff.toFixed(2)} points of error avoided`,
          text:`BLS never published October 2025 CPI because of the government shutdown. Computing year-over-year inflation by counting back twelve rows, a common shortcut, would silently compare against the wrong month for the following year, overstating inflation by as much as ${maxDiff.toFixed(2)} points (${fmtMonth(diffAt)}). The pipeline rebuilds a complete monthly calendar and interpolates the gap instead.`,
          link:'#methodology'});
      }
      body.innerHTML = items.length ? items.map((it,i)=>`<div class="card finding"><span class="n">${i+1}</span><div><h3>${it.title}</h3><p>${it.text}</p>
          <span class="stat">${it.stat}</span>${it.link?`<a class="link-more more" href="${it.link}">See the data →</a>`:''}</div></div>`).join('') : pending('Findings');
    })();

    // accuracy by horizon
    (function(){
      const card = document.getElementById('horizonCard');
      const hz = hzRaw.map(r=>({h:+r.horizon, n:+r.n, m:num(r.model_mae), nv:num(r.naive_mae), cov:num(r.coverage_95)})).filter(r=>r.m!=null).sort((a,b)=>a.h-b.h);
      if(!hz.length){ card.innerHTML = pending('The horizon analysis'); return; }
      const pick = hz.filter(r=>[1,2,3,6,9,12].includes(r.h));
      const maxV = Math.max(...hz.map(r=>Math.max(r.m, r.nv)));
      const h1 = hz[0], hL = hz[hz.length-1];
      const avgCov = hz.reduce((s,r)=>s+r.cov*r.n,0)/hz.reduce((s,r)=>s+r.n,0);
      const calib = avgCov < 88 ? 'too narrow: actual values fall outside more often than the model claims' : avgCov > 98.5 ? 'conservative: wider than they need to be' : 'close to their stated 95% level';
      card.innerHTML = `
        <p class="card-title">Average miss by horizon</p>
        <p class="card-sub">${h1.h}-month ahead: ${h1.m.toFixed(2)} pp vs ${h1.nv.toFixed(2)} pp naive. ${hL.h}-month ahead: ${hL.m.toFixed(2)} pp vs ${hL.nv.toFixed(2)} pp naive.
          Across all horizons the 95% intervals contained the actual value ${avgCov.toFixed(0)}% of the time, so they are ${calib}.
          This test uses ${hz[0].n} forecast origins, a longer window than the 24-month backtest above, so its 1-month figure differs.</p>
        <div class="legend"><span><i class="key-area" style="background:var(--c-model)"></i>${esc(modelLabel)}</span><span><i class="key-area" style="background:var(--c-ref)"></i>Naive benchmark</span></div>
        <div class="hz-row hz-head"><span>Horizon</span><span>Mean absolute error (pp)</span><span class="hz-cov">In 95% interval</span></div>
        ${pick.map(r=>`<div class="hz-row"><span>${r.h} month${r.h>1?'s':''}</span>
          <span class="hz-bars">
            <span class="hz-bar"><span class="b model" style="width:${(r.m/maxV*85).toFixed(1)}%"></span><span class="v">${r.m.toFixed(2)}</span></span>
            <span class="hz-bar"><span class="b naive" style="width:${(r.nv/maxV*85).toFixed(1)}%"></span><span class="v">${r.nv.toFixed(2)}</span></span>
          </span>
          <span class="hz-cov">${r.cov.toFixed(0)}% <span class="muted" style="font-size:12px">of ${r.n}</span></span></div>`).join('')}`;
    })();

    // archive
    (function(){
      const card = document.getElementById('archiveCard');
      const ar = arRaw.map(r=>({vintage:parseDate(r.vintage), target:parseDate(r.target_date), h:+r.horizon, f:num(r.forecast), lo:num(r.lower_95), hi:num(r.upper_95)})).filter(r=>r.f!=null);
      if(!ar.length){ card.innerHTML = pending('The forecast archive'); return; }
      const vintages = [...new Set(ar.map(r=>r.vintage.getTime()))].sort();
      const scored = ar.filter(r=>r.h===1).map(r=>{ const a=cpiAt.get(r.target.getTime()); return a && a.yoy!=null && !a.interpolated ? {...r, actual:a.yoy, err:a.yoy-r.f} : null; }).filter(Boolean);
      const first = new Date(vintages[0]);
      let html = `<div class="card-head"><div><p class="card-title">${vintages.length} forecast${vintages.length>1?'s':''} archived since ${fmtMonth(addMonths(first,1))}</p>
        <p class="card-sub">One-month-ahead forecasts compared with the published CPI print.</p></div></div>`;
      if(!scored.length){
        html += `<div class="empty">The first archived forecast targets ${fmtMonthLong(addMonths(first,1))}. It will be scored automatically when BLS publishes that month's CPI.</div>`;
      } else {
        const mae = scored.reduce((s,r)=>s+Math.abs(r.err),0)/scored.length;
        const inside = scored.filter(r=>r.actual>=r.lo && r.actual<=r.hi).length;
        html += `<p class="card-sub"><b style="color:var(--ink)">Live MAE ${mae.toFixed(2)} pp</b> across ${scored.length} month${scored.length>1?'s':''} · ${inside} of ${scored.length} inside the 95% interval.</p>
          <table><thead><tr><th>Target month</th><th class="r">Forecast</th><th class="r">Actual</th><th class="r">Error</th></tr></thead><tbody>
          ${scored.slice().reverse().map(r=>`<tr><td>${fmtMonth(r.target)}</td><td class="r">${pct(r.f,2)}</td><td class="r">${pct(r.actual,2)}</td><td class="r">${pp(r.err,2)}</td></tr>`).join('')}</tbody></table>`;
      }
      card.innerHTML = html;
    })();

    // ---- drivers ----
    (function(){
      const body = document.getElementById('driversBody');
      if(!compLatest.length){ body.innerHTML = pending('Component data'); return; }
      const core = compLatest.find(c=>c.key==='core');
      const top = compLatest.slice().sort((a,b)=>b.v-a.v)[0];
      body.innerHTML = `
        <div class="grid-2">
          <div class="card">
            <p class="card-title">Year-over-year change by component, ${fmtMonth(compLatest[0].date)}</p>
            <p class="card-sub">${esc(top.label)} is rising fastest at ${spct(top.v)}.${core?` Core inflation, which strips out volatile food and energy, is ${pct(core.v)}.`:''}</p>
            ${hbars([{label:'All items', value:latest.yoy, color:'ink', em:true}].concat(compLatest.map(c=>({label:c.label, value:c.v}))), {fmt:v=>spct(v)})}
          </div>
          <div class="card">
            <p class="card-title">Why these four?</p>
            <ul class="card-sub" style="padding-left:18px; margin:6px 0 0; display:grid; gap:6px">
              <li><b style="color:var(--ink)">Core</b> excludes food and energy. Economists and the Fed watch it as the best guide to underlying inflation.</li>
              <li><b style="color:var(--ink)">Energy</b> swings with oil prices and can move headline inflation by several points in a year.</li>
              <li><b style="color:var(--ink)">Food</b> reflects harvests, supply chains and commodity costs.</li>
              <li><b style="color:var(--ink)">Shelter</b> is the largest single weight in CPI, about a third of the index, and moves slowly.</li>
            </ul>
          </div>
        </div>
        <h2>Components over the last 10 years</h2>
        <p class="sec-sub">Each panel shows one component (blue) against all-items inflation (gray). Each panel has its own scale.</p>
        <div class="legend"><span><i class="key-line" style="background:var(--c-actual)"></i>Component</span><span><i class="key-line" style="background:var(--c-ref)"></i>All items</span></div>
        <div class="grid-2">${compLatest.map(c=>`<div class="card"><p class="card-title">${esc(c.label)}</p><p class="card-sub">${c.key==='core'?'All items less food and energy · ':''}latest ${spct(c.v)} year over year</p><div class="chart" id="comp-${c.key}"></div></div>`).join('')}</div>`;
      const start = addMonths(latest.date, -120);
      compLatest.forEach(c=>{
        const s = c.series.filter(p=>p.date>=start);
        const head = s.map(p=>{ const d=cpiAt.get(p.date.getTime()); return d ? d.yoy : null; });
        mount(document.getElementById('comp-'+c.key), lineChart({
          aria:c.label+' inflation', height:200, dates:s.map(p=>p.date),
          series:[{label:'All items', cls:'ref', values:head}, {label:c.label, cls:'actual', values:s.map(p=>p.v), endMarker:true}],
          zeroLine:true, yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(1)+'%',
        }));
      });
    })();

    // ---- everyday prices ----
    (function(){
      const body = document.getElementById('pricesBody');
      const ITEMS = [
        {key:'eggs', name:'Eggs', unit:'Grade A large, per dozen'},
        {key:'gasoline', name:'Gasoline', unit:'Regular unleaded, per gallon'},
        {key:'milk', name:'Milk', unit:'Whole, per gallon'},
        {key:'coffee', name:'Coffee', unit:'Ground roast, per pound'},
        {key:'bread', name:'Bread', unit:'White pan, per pound'},
      ].map(it=>{ const s=seriesFrom(it.key); if(!s || s.length<13) return null;
        const l=s[s.length-1], y=s.find(p=>p.date.getTime()===addMonths(l.date,-12).getTime());
        return {...it, s, latest:l, chg: y ? (l.v/y.v-1)*100 : null}; }).filter(Boolean);
      if(!ITEMS.length){ body.innerHTML = pending('Price data'); return; }
      body.innerHTML = `<div class="grid-4" id="priceCards" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${ITEMS.map((it,i)=>`
        <button class="price-card" data-k="${it.key}" aria-pressed="${i===0}">
          <div class="p-name">${it.name}</div><div class="p-unit">${it.unit}</div>
          <div class="p-val num">${usd(it.latest.v)}</div>
          <div class="p-chg ${it.chg>0?'up-bad':'down-good'}">${spct(it.chg)} <span style="color:var(--muted);font-weight:400">vs a year ago</span></div>
          <div class="chart" id="spark-${it.key}"></div>
        </button>`).join('')}</div>
        <div class="card" style="margin-top:12px">
          <div class="card-head"><div><p class="card-title" id="priceTitle"></p><p class="card-sub" id="priceSub"></p></div>
            ${segControl('priceRange', [{v:'60',label:'5Y'},{v:'120',label:'10Y'},{v:'0',label:'All'}], '120')}</div>
          <div class="chart" id="priceChart"></div>
        </div>`;
      ITEMS.forEach(it=>{
        const s = it.s.filter(p=>p.date>=addMonths(it.latest.date,-60));
        mount(document.getElementById('spark-'+it.key), lineChart({compact:true, height:44, dates:s.map(p=>p.date), series:[{label:it.name, cls:'actual', values:s.map(p=>p.v), endMarker:true}], tipFmt:v=>usd(v), aria:it.name+' price, last 5 years'}));
      });
      let sel = ITEMS[0], months = 120;
      const el = document.getElementById('priceChart');
      function drawSel(){
        const s = months ? sel.s.filter(p=>p.date>=addMonths(sel.latest.date,-months)) : sel.s;
        const hi = sel.s.reduce((a,b)=>b.v>a.v?b:a);
        document.getElementById('priceTitle').textContent = `${sel.name}, ${sel.unit.toLowerCase()}`;
        document.getElementById('priceSub').textContent = `${usd(sel.latest.v)} in ${fmtMonth(sel.latest.date)}. Record high ${usd(hi.v)} in ${fmtMonth(hi.date)}.`;
        lineChart({aria:sel.name+' price', height:H(300,240), dates:s.map(p=>p.date), series:[{label:sel.name, cls:'actual', values:s.map(p=>p.v), endMarker:true}], area:true, yFmt:(v,d)=>'$'+v.toFixed(Math.max(d, v<10?2:0)), tipFmt:v=>usd(v)})(el);
      }
      el.__draw = drawSel; charts.push(el);
      document.querySelectorAll('#priceCards .price-card').forEach(b=>b.addEventListener('click', ()=>{
        document.querySelectorAll('#priceCards .price-card').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
        sel = ITEMS.find(i=>i.key===b.dataset.k); drawSel();
      }));
      bindSeg('priceRange', v=>{ months=+v; drawSel(); });
    })();

    // ---- history ----
    (function(){
      const EVENTS = [
        {d:'1951-02', label:'Korean War'}, {d:'1974-12', label:'Oil embargo'}, {d:'1980-03', label:'Volcker era peak'},
        {d:'1990-10', label:'Gulf War'}, {d:'2008-07', label:'Oil spike'}, {d:'2009-07', label:'Financial crisis', below:true, low:true},
        {d:'2022-06', label:'Post-pandemic peak'},
      ];
      const idxOf = new Map(yoyData.map((d,i)=>[d.date.getTime(), i]));
      const events = EVENTS.map(e=>{
        const c = idxOf.get(parseDate(e.d+'-01').getTime()); if(c==null) return null;
        let best=c; for(let k=Math.max(0,c-10); k<=Math.min(yoyData.length-1,c+10); k++){ if(e.low ? yoyData[k].yoy<yoyData[best].yoy : yoyData[k].yoy>yoyData[best].yoy) best=k; }
        return {i:best, label:`${e.label}: ${pct(yoyData[best].yoy)}`, below:e.below};
      }).filter(Boolean);
      mount(document.getElementById('longChart'), lineChart({
        aria:'Year-over-year CPI inflation since 1948', height:H(380,260), dates:yoyData.map(d=>d.date),
        series:[{label:'YoY inflation', cls:'actual', values:yoyData.map(d=>d.yoy), endMarker:true}],
        refs:[{value:FED_TARGET, label:''}], zeroLine:true, events,
        yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+'%',
      }));
      const mom = data.slice(-36);
      mount(document.getElementById('momChart'), columnChart({
        aria:'Month-over-month CPI change', height:220, dates:mom.map(d=>d.date), values:mom.map(d=>d.mom), label:'MoM change',
        notes: mom.map(d=>d.interpolated?'Interpolated (not published)':''), yFmt:(v,d)=>v.toFixed(Math.max(1,d))+'%', tipFmt:v=>v.toFixed(2)+'%',
      }));
      document.getElementById('dl').addEventListener('click', e=>{
        e.preventDefault();
        let csv = "date,cpi,mom_pct,yoy_pct,interpolated\n";
        data.forEach(r=>{ csv += `${isoDate(r.date)},${r.cpi.toFixed(3)},${r.mom!=null?r.mom.toFixed(4):''},${r.yoy!=null?r.yoy.toFixed(4):''},${r.interpolated?1:0}\n`; });
        const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='us_cpi_inflation.csv';
        document.body.appendChild(a); a.click(); a.remove();
      });
    })();

    // ---- your money: calculator ----
    (function(){
      const years = {};
      data.forEach(d=>{ const y=d.date.getUTCFullYear(); (years[y]=years[y]||[]).push(d.cpi); });
      const latestYear = latest.date.getUTCFullYear();
      const levelOf = y => +y===latestYear ? latest.cpi : years[y].reduce((a,b)=>a+b,0)/years[y].length;
      const yearList = Object.keys(years).map(Number).filter(y=>y===latestYear || years[y].length===12).sort((a,b)=>a-b);
      const labelOf = y => y===latestYear ? `${fmtMonth(latest.date)} (latest)` : String(y);
      const from = document.getElementById('calcFrom'), to = document.getElementById('calcTo'), amt = document.getElementById('calcAmt');
      from.innerHTML = yearList.map(y=>`<option value="${y}" ${y===2000?'selected':''}>${labelOf(y)}</option>`).join('');
      to.innerHTML = yearList.map(y=>`<option value="${y}" ${y===latestYear?'selected':''}>${labelOf(y)}</option>`).join('');
      const chartEl = document.getElementById('calcChart');
      function update(){
        const a = Math.max(0, parseFloat(amt.value)||0), fy=+from.value, ty=+to.value;
        const val = a * levelOf(ty)/levelOf(fy);
        const cum = (levelOf(ty)/levelOf(fy)-1)*100;
        const yrs = Math.abs(ty-fy) || 1, ann = (Math.pow(levelOf(ty)/levelOf(fy), 1/yrs)-1)*100;
        document.getElementById('calcResult').innerHTML = `${usd(a)} in ${esc(labelOf(fy))} has the same buying power as <span class="big">${usd(val)}</span> in ${esc(labelOf(ty))}.`;
        document.getElementById('calcSub').textContent = fy===ty ? 'Pick two different years.' :
          `Prices ${cum>=0?'rose':'fell'} ${Math.abs(cum).toFixed(1)}% in total, about ${Math.abs(ann).toFixed(1)}% a year. ` + (fy<ty ? `Put the other way, ${usd(a)} today buys what ${usd(a*levelOf(fy)/levelOf(ty))} bought in ${fy}.` : '');
        const lo = Math.min(fy,ty), hi = Math.max(fy,ty);
        const pts = data.filter(d=>d.date.getUTCFullYear()>=lo && d.date<=(hi===latestYear?latest.date:new Date(Date.UTC(hi,11,1))));
        chartEl.__draw = el=>lineChart({aria:'Purchasing power over time', height:H(220,180), dates:pts.map(d=>d.date),
          series:[{label:`What ${usd(a,0)} from ${lo} buys`, cls:'actual', values:pts.map(d=>a*levelOf(lo)/d.cpi), endMarker:true}], area:true,
          yFmt:(v,d)=>'$'+v.toFixed(d), tipFmt:v=>usd(v)})(el);
        if(chartEl.offsetParent!==null) chartEl.__draw(chartEl);
      }
      charts.push(chartEl);
      [from,to].forEach(s=>s.addEventListener('change', update)); amt.addEventListener('input', update);
      update();
    })();

    // ---- your money: wages ----
    (function(){
      const body = document.getElementById('wagesBody');
      const w = compYoY('wages');
      if(!w || !w.length){ body.innerHTML = pending('Wage data'); return; }
      const lw = w[w.length-1], pAt = cpiAt.get(lw.date.getTime()), real = pAt ? ((1+lw.v/100)/(1+pAt.yoy/100)-1)*100 : null;
      const start = addMonths(lw.date, -240), ws = w.filter(p=>p.date>=start);
      const realS = ws.map(p=>{ const c=cpiAt.get(p.date.getTime()); return c ? ((1+p.v/100)/(1+c.yoy/100)-1)*100 : null; });
      const negMonths = realS.filter(v=>v!=null && v<0).length;
      body.innerHTML = `
        <div class="grid-3">
          <div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(--c-3)"></span>Wages, past 12 months</div><div class="kpi-value num">${spct(lw.v)}</div><div class="kpi-sub">Average hourly earnings, ${fmtMonth(lw.date)}</div></div>
          <div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(--c-actual)"></span>Prices, past 12 months</div><div class="kpi-value num">${pAt?spct(pAt.yoy):'—'}</div><div class="kpi-sub">CPI, ${fmtMonth(lw.date)}</div></div>
          <div class="kpi"><div class="kpi-label">Real wage growth</div><div class="kpi-value num ${Math.abs(real)<0.05?'':real>0?'down-good':'up-bad'}">${spct(real)}</div><div class="kpi-sub">${Math.abs(real)<0.05?'Paychecks are roughly keeping pace':real>0?'Paychecks are outpacing prices':'Prices are outpacing paychecks'}</div></div>
        </div>
        <div class="card" style="margin-top:12px">
          <p class="card-title">Wage growth vs inflation, last 20 years</p>
          <p class="card-sub">When the green line is below the blue line, real wages are falling. That happened in ${negMonths} of the last ${realS.filter(v=>v!=null).length} months.</p>
          <div class="legend"><span><i class="key-line" style="background:var(--c-3)"></i>Wage growth</span><span><i class="key-line" style="background:var(--c-actual)"></i>Inflation</span></div>
          <div class="chart" id="wageChart"></div>
        </div>`;
      mount(document.getElementById('wageChart'), lineChart({
        aria:'Wage growth vs inflation', height:H(320,240), dates:ws.map(p=>p.date),
        series:[{label:'Inflation', cls:'actual', values:ws.map(p=>{ const c=cpiAt.get(p.date.getTime()); return c?c.yoy:null; })}, {label:'Wage growth', cls:'c3', values:ws.map(p=>p.v), endMarker:true}],
        zeroLine:true, yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(1)+'%',
      }));
    })();

    // ---- expectations ----
    (function(){
      const body = document.getElementById('expBody'), fcExp = document.getElementById('fcExpect');
      const mich = seriesFrom('exp_consumers_1y'), be = seriesFrom('exp_market_10y');
      if(!mich && !be){ body.innerHTML = pending('Expectations data'); fcExp.textContent = 'Survey and market expectations will appear after the next data update.'; return; }
      const lm = mich && mich[mich.length-1], lb = be && be[be.length-1];
      fcExp.innerHTML = `Model, 12 months ahead: <b style="color:var(--ink)">${pct(last12.mean)}</b>` + (lm?` · Consumers, next 12 months: <b style="color:var(--ink)">${pct(lm.v)}</b>`:'') + (lb?` · Markets, next 10 years: <b style="color:var(--ink)">${pct(lb.v,2)}</b>`:'');
      body.innerHTML = `
        <div class="grid-3">
          <div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(--c-model)"></span>Model, ${fmtMonth(last12.date)}</div><div class="kpi-value num">${pct(last12.mean)}</div><div class="kpi-sub">${esc(modelLabel)}, 12 months ahead</div></div>
          <div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(--c-3)"></span>Consumers, next 12 months</div><div class="kpi-value num">${lm?pct(lm.v):'—'}</div><div class="kpi-sub">${lm?'U. Michigan survey, '+fmtMonth(lm.date):'Not yet available'}</div></div>
          <div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(--c-4)"></span>Markets, next 10 years</div><div class="kpi-value num">${lb?pct(lb.v,2):'—'}</div><div class="kpi-sub">${lb?'10-year breakeven, '+fmtMonth(lb.date)+' average':'Not yet available'}</div></div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="card-head"><div><p class="card-title">Actual inflation and expectations</p><p class="card-sub">Expectations are plotted on the date they were measured, not the period they refer to.</p></div>
            ${segControl('expRange', [{v:'120',label:'10Y'},{v:'240',label:'20Y'},{v:'0',label:'Since 1978'}], '120')}</div>
          <div class="legend"><span><i class="key-line" style="background:var(--c-actual)"></i>Actual</span><span><i class="key-dash" style="border-color:var(--c-model)"></i>Model forecast</span><span><i class="key-line" style="background:var(--c-3)"></i>Consumers (1-yr)</span><span><i class="key-line" style="background:var(--c-4)"></i>Markets (10-yr)</span><span><i class="key-dash" style="border-color:var(--c-ref)"></i>Fed 2% target</span></div>
          <div class="chart" id="expChart"></div>
        </div>
        <div class="card" style="margin-top:12px"><p class="card-title">Why they differ</p>
          <p class="card-sub" style="margin-bottom:0">Households tend to anchor on prices they see often, like gasoline and groceries, so survey expectations run above measured inflation after energy shocks.
          The breakeven rate is the gap between regular and inflation-protected Treasury yields; it covers ten years and also reflects risk and liquidity premia.
          The model knows only past CPI, so it drifts back toward the long-run average.</p></div>`;
      const michMap = new Map((mich||[]).map(p=>[p.date.getTime(), p.v])), beMap = new Map((be||[]).map(p=>[p.date.getTime(), p.v]));
      let months = 120;
      const el = document.getElementById('expChart');
      mount(el, el=>{
        const first = months ? addMonths(latest.date, -months) : parseDate('1978-01-01');
        const hist = yoyData.filter(d=>d.date>=first), nH=hist.length, nF=forecast.length;
        const dates = hist.map(d=>d.date).concat(forecast.map(f=>f.date));
        lineChart({aria:'Inflation expectations', height:H(340,260), dates,
          series:[
            {label:'Markets (10-yr)', cls:'c4', values:dates.map(d=>beMap.has(d.getTime())?beMap.get(d.getTime()):null)},
            {label:'Consumers (1-yr)', cls:'c3', values:dates.map(d=>michMap.has(d.getTime())?michMap.get(d.getTime()):null)},
            {label:'Actual', cls:'actual', values:hist.map(d=>d.yoy).concat(padN(nF)), endMarker:true},
            {label:'Model forecast', cls:'model', dashed:true, values:padN(nH-1).concat([hist[nH-1].yoy], forecast.map(f=>f.mean)), skipTipAt:i=>i===nH-1},
          ], refs:[{value:FED_TARGET, label:''}], yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+'%'})(el);
      });
      bindSeg('expRange', v=>{ months=+v; el.__draw(el); });
    })();

    // ---- fed ----
    (function(){
      const body = document.getElementById('fedBody');
      const ff = seriesFrom('fed_funds');
      if(!ff){ body.innerHTML = pending('Interest rate data'); return; }
      const lf = ff[ff.length-1], cp = cpiAt.get(lf.date.getTime()), realRate = cp ? lf.v - cp.yoy : null;
      const peak = ff.reduce((a,b)=>b.v>a.v?b:a);
      body.innerHTML = `
        <div class="grid-3">
          <div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(--c-4)"></span>Federal funds rate</div><div class="kpi-value num">${pct(lf.v,2)}</div><div class="kpi-sub">Effective rate, ${fmtMonth(lf.date)}</div></div>
          <div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(--c-actual)"></span>CPI inflation</div><div class="kpi-value num">${cp?pct(cp.yoy):'—'}</div><div class="kpi-sub">Year over year, ${fmtMonth(lf.date)}</div></div>
          <div class="kpi"><div class="kpi-label">Real policy rate</div><div class="kpi-value num">${realRate!=null?pp(realRate):'—'}</div><div class="kpi-sub">${realRate==null?'':realRate>1?'Well above zero: policy is restraining demand':realRate>=-0.5?'Near zero: policy is close to neutral':'Below zero: policy is still accommodative'}</div></div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="card-head"><div><p class="card-title">Federal funds rate and inflation</p><p class="card-sub">The highest rate on record was ${pct(peak.v,1)} in ${fmtMonth(peak.date)}${peak.date.getUTCFullYear()>=1979 && peak.date.getUTCFullYear()<=1982 ? ', when the Fed under Paul Volcker broke the inflation of the 1970s' : ''}.</p></div>
            ${segControl('fedRange', [{v:'120',label:'10Y'},{v:'300',label:'25Y'},{v:'0',label:'All'}], '0')}</div>
          <div class="legend"><span><i class="key-line" style="background:var(--c-4)"></i>Fed funds rate</span><span><i class="key-line" style="background:var(--c-actual)"></i>CPI inflation</span></div>
          <div class="chart" id="fedChart"></div>
        </div>`;
      let months = 0;
      const el = document.getElementById('fedChart');
      mount(el, el=>{
        const first = months ? addMonths(lf.date, -months) : ff[0].date;
        const pts = ff.filter(p=>p.date>=first && cpiAt.has(p.date.getTime()));
        lineChart({aria:'Fed funds rate vs inflation', height:H(340,260), dates:pts.map(p=>p.date),
          series:[{label:'CPI inflation', cls:'actual', values:pts.map(p=>cpiAt.get(p.date.getTime()).yoy)}, {label:'Fed funds rate', cls:'c4', values:pts.map(p=>p.v), endMarker:true}],
          zeroLine:true, yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+'%'})(el);
      });
      bindSeg('fedRange', v=>{ months=+v; el.__draw(el); });
    })();

    // =============== router ===============
    const PAGES = ['overview','findings','forecast','track-record','drivers','prices','history','money','expectations','fed','methodology'];
    function show(){
      let id = (location.hash||'').slice(1);
      if(!PAGES.includes(id)) id = 'overview';
      document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+id));
      document.querySelectorAll('.nav-link').forEach(a=>a.setAttribute('aria-current', a.getAttribute('href')==='#'+id ? 'page' : 'false'));
      const title = document.getElementById('page-'+id).dataset.title;
      document.title = id==='overview' ? 'U.S. Inflation Forecast' : `${title} · U.S. Inflation Forecast`;
      window.scrollTo(0,0);
      const active = document.querySelector('.nav-link[aria-current="page"]');
      if(active && window.innerWidth<=900) active.scrollIntoView({inline:'center', block:'nearest'});
      requestAnimationFrame(redrawVisible);
    }
    window.addEventListener('hashchange', show);
    show();
  }

  main();
})();
</script>
</body>
</html>
