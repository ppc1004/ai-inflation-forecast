<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U.S. Inflation Forecast</title>
<meta name="description" content="U.S. CPI inflation tracker and 12-month ARIMA forecast with a public backtest track record, inflation drivers, everyday prices, wages, expectations and Fed policy context.">
<meta property="og:type" content="website">

<meta property="og:url" content="https://ppc1004.github.io/us-inflation-forecast/">
<meta property="og:image" content="https://ppc1004.github.io/us-inflation-forecast/data/social_preview.png">
<meta property="og:image:width" content="1200">

<meta name="twitter:title" content="U.S. Inflation Forecast">
<meta name="twitter:description" content="U.S. CPI inflation tracker and 12-month ARIMA forecast with a transparent backtest track record.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232a78d6%22/><path d=%22M6 22 L12 15 L17 18 L26 8%22 fill=%22none%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --page:#f7f7f5; --surface:#ffffff; --side:#f1f0ec;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#ebeae4; --axis:#c3c2b7; --border:rgba(11,11,11,.09);
    --c-actual:#2a78d6; --c-model:#eb6834; --c-3:#1baf7a; --c-4:#4a3aa7; --c-ref:#9a9892;
    --c-good:#006300; --c-bad:#b42318;
    --band-opacity:.13;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:#0f0f0e; --surface:#1a1a19; --side:#141413;
      --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
      --grid:#2c2c2a; --axis:#44443f; --border:rgba(255,255,255,.09);
      --c-actual:#3987e5; --c-model:#d95926; --c-3:#199e70; --c-4:#9085e9; --c-ref:#77756f;
      --c-good:#0ca30c; --c-bad:#e66767; --band-opacity:.16;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0f0f0e; --surface:#1a1a19; --side:#141413;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2c2c2a; --axis:#44443f; --border:rgba(255,255,255,.09);
    --c-actual:#3987e5; --c-model:#d95926; --c-3:#199e70; --c-4:#9085e9; --c-ref:#77756f;
    --c-good:#0ca30c; --c-bad:#e66767; --band-opacity:.16;
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- shell: sidebar + content ---------- */
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh;}
  .side{position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--side); border-right:1px solid var(--border); padding:22px 14px; display:flex; flex-direction:column; gap:22px;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:650; font-size:14.5px; letter-spacing:-.01em; text-decoration:none; padding:0 8px; white-space:nowrap;}
  .brand-mark{width:24px; height:24px; border-radius:7px; background:var(--c-actual); display:grid; place-items:center; flex:none;}
  .nav-group{display:flex; flex-direction:column; gap:1px;}
  .nav-label{font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:0 10px 6px;}
  .nav-link{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-2); text-decoration:none; padding:7px 10px; border-radius:8px; white-space:nowrap;}
  .nav-link:hover{background:var(--border); color:var(--ink);}
  .nav-link[aria-current="page"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 0 0 1px var(--border);}
  .nav-link svg{flex:none; opacity:.75;}
  .side-foot{margin-top:auto; font-size:12px; color:var(--muted); padding:0 10px; display:grid; gap:8px;}
  .side-foot a{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); text-decoration:none;}
  .side-foot a:hover{color:var(--ink);}
  .status{display:grid; gap:2px; line-height:1.4;}
  .status .row{display:flex; align-items:center; gap:6px;}
  .status .dot{width:7px; height:7px; border-radius:50%; background:var(--c-good); flex:none;}
  .status .sub{padding-left:13px;}

  .content{min-width:0; width:100%; max-width:2200px; padding:40px clamp(20px, 3vw, 56px) 64px;}
  .page{display:none;}
  .page.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* ---------- page headers ---------- */
  .eyebrow{font-size:13px; font-weight:500; color:var(--ink-2); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:3px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--ink-2);}
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--c-good);}
  h1{font-size:clamp(26px, 3.4vw, 38px); line-height:1.15; letter-spacing:-.02em; font-weight:700; margin:12px 0 10px; max-width:900px;}
  .page-title{font-size:clamp(24px, 2.6vw, 30px); letter-spacing:-.02em; font-weight:700; margin:0 0 6px;}
  .lede{font-size:16px; color:var(--ink-2); max-width:740px; margin:0 0 26px;}
  .lede b{color:var(--ink); font-weight:600;}
  h2{font-size:19px; letter-spacing:-.01em; margin:30px 0 4px; font-weight:650;}
  .sec-sub{color:var(--ink-2); font-size:14px; margin:0 0 12px; max-width:760px;}

  /* ---------- cards & grids ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;}
  .stack > * + *{margin-top:12px;}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .card-title{font-size:15px; font-weight:600; margin:0;}
  .card-sub{font-size:13px; color:var(--ink-2); margin:2px 0 12px;}
  .grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
  .link-more{font-size:13px; font-weight:500; color:var(--c-actual); text-decoration:none; white-space:nowrap;}
  .link-more:hover{text-decoration:underline;}

  /* ---------- KPI tiles ---------- */
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px 18px; min-width:0;}
  .kpi-label{font-size:13px; color:var(--ink-2); font-weight:500;}
  .kpi-value{font-size:28px; font-weight:600; letter-spacing:-.02em; margin-top:6px; line-height:1.1;}
  .kpi-value small{font-size:14px; font-weight:500; color:var(--ink-2); letter-spacing:0;}
  .kpi-sub{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .kpi.hero .kpi-value{font-size:42px;}
  .up-bad{color:var(--c-bad);} .down-good{color:var(--c-good);}
  .key-swatch{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:0;}

  /* ---------- controls ---------- */
  .seg{display:inline-flex; background:var(--page); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px;}
  .seg button{font:inherit; font-size:13px; font-weight:500; border:0; background:none; color:var(--ink-2); padding:4px 11px; border-radius:7px; cursor:pointer;}
  .seg button:hover{color:var(--ink);}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
  .field{display:grid; gap:4px; font-size:12.5px; color:var(--ink-2); font-weight:500;}
  .field input, .field select{font:inherit; font-size:15px; color:var(--ink); background:var(--page); border:1px solid var(--border); border-radius:9px; padding:8px 10px; min-width:0;}
  .field input:focus, .field select:focus{outline:2px solid var(--c-actual); outline-offset:1px;}

  /* ---------- charts ---------- */
  .legend{display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--ink-2); margin:0 0 10px;}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .key-line{width:16px; height:2px; border-radius:1px; display:inline-block;}
  .key-dash{width:16px; height:0; border-top:2px dashed; display:inline-block;}
  .key-area{width:14px; height:10px; border-radius:2px; display:inline-block;}
  .chart{position:relative; width:100%;}
  .chart svg{display:block; width:100%; overflow:visible;}
  .chart text{font-family:var(--sans); font-size:12px; fill:var(--muted); font-variant-numeric:tabular-nums;}
  .chart .grid line{stroke:var(--grid); stroke-width:1;}
  .chart .baseline{stroke:var(--axis); stroke-width:1;}
  .chart .ref{stroke:var(--c-ref); stroke-width:1; stroke-dasharray:3 3;}
  .chart .ref-label{fill:var(--ink-2); font-size:11.5px;}
  .chart .s{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
  .chart .s-actual{stroke:var(--c-actual);} .chart .s-model{stroke:var(--c-model);} .chart .s-c3{stroke:var(--c-3);} .chart .s-c4{stroke:var(--c-4);} .chart .s-ref{stroke:var(--c-ref);}
  .chart .dashed{stroke-dasharray:5 4;}
  .chart .band-model{fill:var(--c-model); opacity:var(--band-opacity);}
  .chart .area-actual{fill:var(--c-actual); opacity:.08;}
  .chart .dot-actual{fill:var(--c-actual);} .chart .dot-model{fill:var(--c-model);} .chart .dot-c3{fill:var(--c-3);} .chart .dot-c4{fill:var(--c-4);} .chart .dot-ref{fill:var(--c-ref);}
  .chart .ring{stroke:var(--surface); stroke-width:2;}
  .chart .bar-actual{fill:var(--c-actual);}
  .chart .bar-actual.hover{opacity:.75;}
  .chart .xhair{stroke:var(--axis); stroke-width:1;}
  .chart .end-label{font-size:12.5px; font-weight:650; fill:var(--ink); stroke:var(--surface); stroke-width:4px; paint-order:stroke; stroke-linejoin:round;}
  .chart .ev-dot{fill:var(--ink); stroke:var(--surface); stroke-width:2;}
  .chart .ev-label{fill:var(--ink-2); font-size:11.5px; font-weight:500;}
  .chart .ev-line{stroke:var(--axis); stroke-width:1;}
  .tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border); box-shadow:0 6px 20px rgba(0,0,0,.12); border-radius:10px; padding:8px 11px; font-size:12.5px; min-width:150px; z-index:5; opacity:0; transition:opacity .08s;}
  .tip .t-date{color:var(--ink-2); font-size:12px; margin-bottom:4px;}
  .tip .t-row{display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .tip .t-row b{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .tip .t-key{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2);}
  .tip .t-note{color:var(--ink); font-weight:500; margin-top:4px;}
  .empty{font-size:13.5px; color:var(--ink-2); background:var(--page); border:1px dashed var(--border); border-radius:10px; padding:18px; text-align:center;}

  /* ---------- horizontal bars (HTML) ---------- */
  .hbars{display:grid; gap:7px;}
  .hb-row{display:grid; grid-template-columns:96px 1fr 64px; align-items:center; gap:12px; font-size:13px;}
  .hb-row.wide{grid-template-columns:190px 1fr 64px 64px;}
  .hb-head{font-size:12px; color:var(--muted);}
  .hb-name{white-space:nowrap; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis;}
  .hb-row.em .hb-name{color:var(--ink); font-weight:600;}
  .hb-track{height:14px; position:relative;}
  .hb-bar{position:absolute; top:0; height:14px; background:var(--grid); border-radius:4px;}
  .hb-bar.pos{border-radius:0 4px 4px 0;} .hb-bar.neg{border-radius:4px 0 0 4px;}
  .hb-bar.c-actual{background:var(--c-actual);} .hb-bar.c-model{background:var(--c-model);} .hb-bar.c-ref{background:var(--c-ref);} .hb-bar.c-ink{background:var(--ink);}
  .hb-zero{position:absolute; top:-3px; bottom:-3px; width:1px; background:var(--axis);}
  .hb-v{text-align:right; font-variant-numeric:tabular-nums;}
  .tag{font-size:10.5px; font-weight:600; letter-spacing:.02em; padding:1px 6px; border-radius:5px; margin-left:6px; vertical-align:1px; border:1px solid var(--border); color:var(--ink-2);}

  /* ---------- findings ---------- */
  .finding{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:start;}
  .finding .n{width:32px; height:32px; border-radius:9px; background:var(--page); border:1px solid var(--border); display:grid; place-items:center; font-weight:650; font-size:14px; color:var(--ink-2);}
  .finding h3{font-size:16.5px; font-weight:650; letter-spacing:-.01em; margin:4px 0 6px;}
  .finding p{margin:0; color:var(--ink-2); font-size:14.5px;}
  .finding .stat{display:inline-block; font-size:13px; font-weight:600; color:var(--ink); background:var(--page); border:1px solid var(--border); border-radius:7px; padding:2px 8px; margin-top:10px;}
  .finding .more{display:inline-block; margin-top:10px; margin-left:8px;}
  .bm-table td.model{font-weight:500;} .bm-table tr.em td{background:color-mix(in srgb, var(--c-model) 7%, transparent);}
  .bm-bar{display:inline-block; height:8px; border-radius:0 4px 4px 0; background:var(--grid); vertical-align:middle; margin-right:8px;}
  .bm-bar.c-model{background:var(--c-model);} .bm-bar.c-ref{background:var(--c-ref);}

  /* ---------- horizon accuracy ---------- */
  .hz-row{display:grid; grid-template-columns:78px 1fr 96px; gap:14px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .hz-row:last-child{border-bottom:0;}
  .hz-head{font-size:12px; color:var(--muted); padding-top:0;}
  .hz-bars{display:grid; gap:4px;}
  .hz-bar{display:flex; align-items:center; gap:8px;}
  .hz-bar .b{height:8px; border-radius:0 4px 4px 0; flex:none;}
  .hz-bar .b.model{background:var(--c-model);} .hz-bar .b.naive{background:var(--c-ref);}
  .hz-bar span.v{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink-2);}
  .hz-cov{text-align:right; font-variant-numeric:tabular-nums;}

  /* ---------- price cards ---------- */
  .price-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 10px; text-align:left; font:inherit; color:inherit; cursor:pointer; min-width:0;}
  .price-card:hover{border-color:var(--axis);}
  .price-card[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c-actual); border-color:transparent;}
  .price-card .p-name{font-size:13.5px; font-weight:600;}
  .price-card .p-unit{font-size:12px; color:var(--muted);}
  .price-card .p-val{font-size:24px; font-weight:600; letter-spacing:-.02em; margin-top:6px;}
  .price-card .p-chg{font-size:12.5px; font-weight:500;}
  .price-card .chart{margin-top:6px;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-weight:500; color:var(--muted); font-size:12.5px; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:9px 10px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:0;}
  th.r, td.r{text-align:right;}
  .muted{color:var(--ink-2);}
  details.more{margin-top:14px; border-top:1px solid var(--border); padding-top:10px;}
  details.more summary{cursor:pointer; font-size:13.5px; font-weight:500; color:var(--ink-2); list-style:none; display:flex; align-items:center; gap:6px;}
  details.more summary::-webkit-details-marker{display:none;}
  details.more summary::before{content:"›"; display:inline-block; transition:transform .15s; font-size:16px; line-height:1;}
  details.more[open] summary::before{transform:rotate(90deg);}
  .scroll{max-height:360px; overflow:auto; margin-top:10px;}

  /* ---------- calculator ---------- */
  .calc-inputs{display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:10px; margin-bottom:16px;}
  .calc-result{font-size:clamp(20px, 2.4vw, 26px); font-weight:600; letter-spacing:-.015em; line-height:1.3;}
  .calc-result .big{color:var(--c-actual);}

  /* ---------- methodology ---------- */
  .method h3{font-size:14.5px; margin:0 0 6px; font-weight:600;}
  .method p, .method li{font-size:14px; color:var(--ink-2); margin:0;}
  .method ul{padding-left:18px; margin:0; display:grid; gap:4px;}
  code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.88em; background:var(--border); padding:1px 5px; border-radius:5px;}
  .pipeline{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12.5px; margin-top:10px;}
  .pipeline .step{background:var(--page); border:1px solid var(--border); border-radius:8px; padding:4px 9px; color:var(--ink);}
  .pipeline .arrow{color:var(--muted);}

  .page-foot{margin-top:40px; padding-top:16px; border-top:1px solid var(--border); font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .loading, .error{padding:80px 24px; text-align:center; color:var(--ink-2);}
  .error{color:var(--c-bad);}

  /* ---------- responsive ---------- */
  @media (max-width: 1100px){
    .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width: 900px){
    .shell{grid-template-columns:1fr;}
    .side{position:sticky; top:0; z-index:20; height:auto; flex-direction:row; align-items:center; gap:10px; padding:10px 12px; border-right:0; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none;}
    .side::-webkit-scrollbar{display:none;}
    .brand .brand-text{display:none;}
    .brand{padding:0 4px;}
    .nav-group{flex-direction:row; gap:4px;}
    .nav-label, .side-foot{display:none;}
    .nav-link{padding:6px 10px; font-size:13.5px;}
    .nav-link svg{display:none;}
    .content{padding:26px 18px 48px;}
    .grid-2, .grid-3{grid-template-columns:1fr;}
  }
  @media (max-width: 560px){
    .grid-4{grid-template-columns:1fr 1fr;}
    .kpi{padding:14px;}
    .kpi-value{font-size:22px;} .kpi.hero .kpi-value{font-size:30px;}
    .card{padding:16px;}
    .calc-inputs{grid-template-columns:1fr 1fr;}
    .calc-inputs .field:first-child{grid-column:1 / -1;}
    .hb-row{grid-template-columns:104px 1fr 56px;}
    .hb-row.wide{grid-template-columns:120px 1fr 52px;}
    .hb-row.wide .hb-rmse, .hb-row .tag{display:none;}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="side" aria-label="Site navigation">
    <a class="brand" href="#overview">
      <span class="brand-mark"><svg width="14" height="14" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 23 L12 15 L17 18 L27 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-text">U.S. Inflation Forecast</span>
    </a>
    <nav class="nav-group" aria-label="Forecast">
      <div class="nav-label">Forecast</div>

<script>
(function(){
  "use strict";

  // The model used by src/arima_forecast.py. Keep in sync if the order changes.
  const MODEL_NAME = "ARIMA(1, 0, 2)";
  const FED_TARGET = 2.0;

  // ================= helpers =================
  function splitCSVLine(line){
    const out=[]; let cur=''; let q=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ q=!q; }
      else if(c===',' && !q){ out.push(cur); cur=''; }
      else { cur+=c; }
    }
    out.push(cur);
    return out;
  }
  function parseCSV(text){
    const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.length>0);
    if(!lines.length) return [];
    const headers = splitCSVLine(lines[0]);
    return lines.slice(1).map(line=>{
      const cells = splitCSVLine(line); const o={};
      headers.forEach((h,i)=>{ o[h]=cells[i]; });
      return o;
    });
  }
  const num = v => (v===undefined || v==='' || v===null) ? null : (isNaN(parseFloat(v)) ? null : parseFloat(v));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const parseDate = s => { const p=s.split('-').map(x=>parseInt(x,10)); return new Date(Date.UTC(p[0], p[1]-1, p[2]||1)); };
  const fmtMonth = d => MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
  const fmtMonthLong = d => MONTHS_LONG[d.getUTCMonth()] + " " + d.getUTCFullYear();
  const isoDate = d => d.toISOString().slice(0,10);
  const fix0 = (v, d) => { const s = v.toFixed(d); return /^-0\.?0*$/.test(s) ? s.slice(1) : s; };
  const pct = (v, d=1) => (v==null || !isFinite(v)) ? "—" : fix0(v, d) + "%";
  const sgn = (v, d) => +Math.abs(v).toFixed(d)===0 ? "" : v>0 ? "+" : "−";
  const spct = (v, d=1) => (v==null || !isFinite(v)) ? "—" : sgn(v,d) + Math.abs(v).toFixed(d) + "%";
  const pp = (v, d=1) => (v==null || !isFinite(v)) ? "—" : sgn(v,d) + Math.abs(v).toFixed(d) + " pp";
  const usd = (v, d=2) => (v==null || !isFinite(v)) ? "—" : "$" + v.toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d});
  const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const addMonths = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n, 1));
  const monthDiff = (a, b) => (b.getUTCFullYear()-a.getUTCFullYear())*12 + (b.getUTCMonth()-a.getUTCMonth());
  const cleanModel = s => String(s).replace(/\s+/g,' ').trim();
  const lastIdx = arr => { for(let i=arr.length-1;i>=0;i--) if(arr[i]!=null && isFinite(arr[i])) return i; return -1; };

  async function loadCSV(path, optional){
    try{
      const res = await fetch(path, {cache:"no-store"});
      if(!res.ok) throw new Error(`Failed to load ${path} (HTTP ${res.status})`);
      return parseCSV(await res.text());
    }catch(e){ if(optional) return []; throw e; }
  }

  // Linearly fill gaps that sit between two known values (e.g. BLS skipped Oct 2025).
  function fillInterior(arr){
    const out = arr.slice();
    let prev = -1;
    for(let i=0;i<out.length;i++){
      if(out[i]==null) continue;
      if(prev>=0 && i-prev>1){ for(let k=prev+1;k<i;k++) out[k] = out[prev] + (out[i]-out[prev])*(k-prev)/(i-prev); }
      prev = i;
    }
    return out;
  }
  const yoyOf = arr => arr.map((v,i)=> (i>=12 && v!=null && arr[i-12]!=null) ? (v/arr[i-12]-1)*100 : null);

  function niceTicks(min, max, count){
    const span = (max - min) || 1;
    const raw = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m=>m*mag).find(s=>s>=raw);
    const start = Math.floor(min/step)*step;
    const out=[];
    for(let i=0; start+i*step < max+step-1e-9; i++) out.push(+(start+i*step).toFixed(10));
    return out;
  }
  const tickDecimals = t => { const s = t.length>1 ? Math.abs(t[1]-t[0]) : 1; return s>=1 ? 0 : s>=0.1 ? 1 : 2; };

  // ================= chart engine (responsive inline SVG) =================
  const SVGNS = "http://www.w3.org/2000/svg";
  const charts = [];
  function mount(el, draw){ el.__draw = draw; charts.push(el); if(el.offsetParent!==null) draw(el); }
  function redrawVisible(){ charts.forEach(el=>{ if(document.body.contains(el) && el.offsetParent!==null) el.__draw(el); }); }
  let rT=null, lastW=window.innerWidth;
  window.addEventListener('resize', ()=>{ if(window.innerWidth===lastW) return; lastW=window.innerWidth; clearTimeout(rT); rT=setTimeout(redrawVisible,120); });

  function monthTicks(t0, t1, width){
    const months = monthDiff(t0, t1);
    const maxTicks = Math.max(2, Math.floor(width/88));
    const steps = [1,2,3,6,12,24,60,120,240];
    const step = steps.find(s=>months/s <= maxTicks) || 240;
    let d;
    if(step<12) d = new Date(Date.UTC(t0.getUTCFullYear(), Math.ceil(t0.getUTCMonth()/step)*step, 1));
    else { const y=step/12; d = new Date(Date.UTC(Math.ceil(t0.getUTCFullYear()/y)*y, 0, 1)); }
    const ticks=[];
    while(d<=t1){ if(d>=t0) ticks.push(d); d = addMonths(d, step); }
    const fmt = step>=12 ? (x=>String(x.getUTCFullYear())) : (x=>MONTHS[x.getUTCMonth()]+" '"+String(x.getUTCFullYear()).slice(2));
    return {ticks, fmt};
  }
  const COLOR_VAR = {actual:'--c-actual', model:'--c-model', c3:'--c-3', c4:'--c-4', ref:'--c-ref'};

  /*
    lineChart(cfg) -> draw(el)
      dates: Date[] shared by every series
      series: [{label, cls, values, dashed?, endMarker?, skipTipAt?(i)}]
      band: {lower, upper, label}   refs: [{value, label}]   events: [{i, label, below?}]
      height, zeroLine, area (fill under first series), compact (sparkline: no axes)
      yFmt(v, decimals), tipFmt(v)
  */
  function lineChart(cfg){
    return function draw(el){
      const W = Math.max(200, el.clientWidth || 600);
      const H = typeof cfg.height === 'function' ? cfg.height(W) : (cfg.height || 320);
      const compact = !!cfg.compact;
      const narrow = W < 520;
      const rightLabel = cfg.series.some(s=>s.endLabel==='right');
      const m = compact ? {t:4, r:4, b:4, l:4} : {t:14, r: rightLabel ? 52 : 14, b:28, l:46};
      const pw = W-m.l-m.r, ph = H-m.t-m.b;
      const dates = cfg.dates, N = dates.length;
      if(!N){ el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
      const t0 = dates[0], t1 = dates[N-1];
      const X = i => m.l + (N>1 ? (dates[i]-t0)/(t1-t0)*pw : pw/2);

      const vals=[];
      cfg.series.forEach(s=>s.values.forEach(v=>{ if(v!=null && isFinite(v)) vals.push(v); }));
      if(cfg.band) cfg.band.lower.concat(cfg.band.upper).forEach(v=>{ if(v!=null && isFinite(v)) vals.push(v); });
      (cfg.refs||[]).forEach(r=>vals.push(r.value));
      if(cfg.zeroLine) vals.push(0);
      if(!vals.length){ el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
      let lo=Math.min(...vals), hi=Math.max(...vals);
      if(lo===hi){ lo-=1; hi+=1; }
      let y0, y1, yt=[];
      if(compact){ const pad=(hi-lo)*0.08; y0=lo-pad; y1=hi+pad; }
      else { yt = niceTicks(lo, hi, narrow?4:5); y0=yt[0]; y1=yt[yt.length-1]; }
      const Y = v => m.t + ph - (v-y0)/(y1-y0)*ph;
      const dec = tickDecimals(yt);
      const yFmt = cfg.yFmt || ((v,d)=>v.toFixed(d));

      let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(cfg.aria||'Chart')}">`;
      if(!compact){
        s += `<g class="grid">` + yt.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('') + `</g>`;
        s += yt.map(t=>`<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${esc(yFmt(t, dec))}</text>`).join('');
        if(cfg.zeroLine && y0<0 && y1>0) s += `<line class="baseline" x1="${m.l}" x2="${W-m.r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>`;
        const mt = monthTicks(t0, t1, pw);
        const xOf = d => m.l + (N>1 ? (d-t0)/(t1-t0)*pw : pw/2);
        s += mt.ticks.map(d=>`<text x="${xOf(d).toFixed(1)}" y="${H-8}" text-anchor="middle">${mt.fmt(d)}</text>`).join('');
      }
      if(cfg.band){
        const idx=[]; for(let i=0;i<N;i++){ if(cfg.band.lower[i]!=null && cfg.band.upper[i]!=null) idx.push(i); }
        if(idx.length){
          let d = idx.map((i,k)=>(k?'L':'M')+X(i).toFixed(1)+' '+Y(cfg.band.upper[i]).toFixed(1)).join(' ');
          d += ' ' + idx.slice().reverse().map(i=>'L'+X(i).toFixed(1)+' '+Y(cfg.band.lower[i]).toFixed(1)).join(' ') + ' Z';
          s += `<path class="band-model" d="${d}"/>`;
        }
      }
      (cfg.refs||[]).forEach(r=>{
        const y=Y(r.value).toFixed(1);
        s += `<line class="ref" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/>`;
        if(r.label && !compact) s += `<text class="ref-label" x="${m.l+6}" y="${(Y(r.value)-6).toFixed(1)}">${esc(r.label)}</text>`;
      });
      function pathOf(values){
        let d='', on=false;
        for(let i=0;i<N;i++){
          const v=values[i];
          if(v==null || !isFinite(v)){ on=false; continue; }
          d += (on?' L':' M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); on=true;
        }
        return d;
      }
      if(cfg.area){
        const v=cfg.series[0].values; const f=v.findIndex(x=>x!=null), l=lastIdx(v);
        if(f>=0) s += `<path class="area-actual" d="${pathOf(v)} L${X(l).toFixed(1)} ${(m.t+ph).toFixed(1)} L${X(f).toFixed(1)} ${(m.t+ph).toFixed(1)} Z"/>`;
      }
      cfg.series.forEach(se=>{ s += `<path class="s s-${se.cls}${se.dashed?' dashed':''}" d="${pathOf(se.values)}"/>`; });
      cfg.series.forEach(se=>{
        if(!se.endMarker) return;
        const i = lastIdx(se.values); if(i<0) return;
        s += `<circle class="dot-${se.cls} ring" cx="${X(i).toFixed(1)}" cy="${Y(se.values[i]).toFixed(1)}" r="${compact?3.5:4.5}"/>`;
      });
      cfg.series.forEach(se=>{
        if(!se.endLabel || compact) return;
        const i = lastIdx(se.values); if(i<0) return;
        const x = X(i), y = Y(se.values[i]), t = esc((cfg.endFmt||cfg.tipFmt||(v=>v.toFixed(1)))(se.values[i]));
        if(se.endLabel==='right') s += `<text class="end-label" x="${(x+9).toFixed(1)}" y="${(y+4).toFixed(1)}">${t}</text>`;
        else {
          // put the label on the side away from the recent line, so it never sits on the curve
          const back = se.values.slice(Math.max(0,i-4), i).filter(v=>v!=null);
          const below = back.length && Math.max(...back) > se.values[i];
          s += `<text class="end-label" x="${(x-8).toFixed(1)}" y="${(below ? y+20 : y-11).toFixed(1)}" text-anchor="end">${t}</text>`;
        }
      });
      // event annotations (history)
      (cfg.events||[]).forEach(ev=>{
        const v = cfg.series[0].values[ev.i]; if(v==null) return;
        const x=X(ev.i), y=Y(v);
        if(!narrow){
          const ly = ev.below ? y+26 : y-22;
          const anchor = x < m.l+60 ? 'start' : x > W-m.r-60 ? 'end' : 'middle';
          s += `<line class="ev-line" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${(ev.below? y+6 : y-6).toFixed(1)}" y2="${(ev.below? ly-12 : ly+4).toFixed(1)}"/>`;
          s += `<text class="ev-label" x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${esc(ev.label)}</text>`;
        }
        s += `<circle class="ev-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
      });
      s += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" visibility="hidden"/><g class="hover-dots"></g>`;
      s += `<rect class="hit" x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg>`;
      el.innerHTML = s;

      const tip = document.createElement('div'); tip.className='tip'; el.appendChild(tip);
      const svg = el.querySelector('svg'), xhair = svg.querySelector('.xhair'), hdots = svg.querySelector('.hover-dots'), hit = svg.querySelector('.hit');
      const tipFmt = cfg.tipFmt || (v=>v.toFixed(2));
      const evAt = new Map((cfg.events||[]).map(e=>[e.i, e.label]));
      function row(key, color, value){
        const r=document.createElement('div'); r.className='t-row';
        const k=document.createElement('span'); k.className='t-key';
        if(color){ const sw=document.createElement('span'); sw.className='key-line'; sw.style.background=`var(${color})`; k.appendChild(sw); }
        k.appendChild(document.createTextNode(key));
        const b=document.createElement('b'); b.textContent=value;
        r.appendChild(k); r.appendChild(b); tip.appendChild(r);
      }
      function show(evt){
        const r = svg.getBoundingClientRect();
        const px = (evt.clientX - r.left) * (W / r.width);
        let best=0, bd=Infinity;
        for(let i=0;i<N;i++){ const dd=Math.abs(X(i)-px); if(dd<bd){ bd=dd; best=i; } }
        const x = X(best);
        tip.textContent=''; hdots.innerHTML='';
        const dt=document.createElement('div'); dt.className='t-date'; dt.textContent=(cfg.dateFmt||fmtMonthLong)(dates[best]); tip.appendChild(dt);
        let any=false;
        cfg.series.forEach(se=>{
          const v=se.values[best]; if(v==null || !isFinite(v)) return;
          if(se.skipTipAt && se.skipTipAt(best)) return;
          any=true;
          const c=document.createElementNS(SVGNS,'circle');
          c.setAttribute('cx',x); c.setAttribute('cy',Y(v)); c.setAttribute('r',compact?3.5:4.5); c.setAttribute('class','ring dot-'+se.cls);
          hdots.appendChild(c);
          row(se.label, COLOR_VAR[se.cls], tipFmt(v));
        });
        if(cfg.band && cfg.band.lower[best]!=null && !(cfg.band.skipTipAt && cfg.band.skipTipAt(best))){ row(cfg.band.label, null, tipFmt(cfg.band.lower[best])+' – '+tipFmt(cfg.band.upper[best])); any=true; }
        if(evAt.has(best)){ const n=document.createElement('div'); n.className='t-note'; n.textContent=evAt.get(best); tip.appendChild(n); }
        if(!any){ hide(); return; }
        xhair.setAttribute('x1', x); xhair.setAttribute('x2', x); xhair.setAttribute('visibility','visible');
        tip.style.opacity=1;
        const sc = r.width / W, tw = tip.offsetWidth;
        let left = x*sc + 14; if(left + tw > r.width) left = x*sc - tw - 14;
        tip.style.left = Math.max(0,left)+'px';
        tip.style.top = compact ? (H*sc+6)+'px' : (m.t*sc + 4)+'px';
      }
      function hide(){ xhair.setAttribute('visibility','hidden'); hdots.innerHTML=''; tip.style.opacity=0; }
      hit.addEventListener('pointermove', show);
      hit.addEventListener('pointerdown', show);
      hit.addEventListener('pointerleave', hide);
    };
  }

  function columnChart(cfg){
    return function draw(el){
      const W = Math.max(200, el.clientWidth || 600), H = cfg.height || 240;
      const m = {t:12, r:12, b:28, l:46};
      const pw=W-m.l-m.r, ph=H-m.t-m.b;
      const N=cfg.values.length;
      const lo=Math.min(0,...cfg.values), hi=Math.max(0,...cfg.values);
      const yt=niceTicks(lo,hi,4), y0=yt[0], y1=yt[yt.length-1];
      const Y=v=>m.t+ph-(v-y0)/(y1-y0)*ph;
      const band=pw/N, bw=Math.min(24, band*0.62), dec=tickDecimals(yt);
      let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(cfg.aria||'Chart')}"><g class="grid">`;
      s+=yt.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('')+`</g>`;
      s+=yt.map(t=>`<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${cfg.yFmt(t,dec)}</text>`).join('');
      const mt = monthTicks(cfg.dates[0], cfg.dates[N-1], pw);
      mt.ticks.forEach(d=>{ const i=cfg.dates.findIndex(x=>x.getTime()===d.getTime()); if(i>=0) s+=`<text x="${(m.l+band*i+band/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${mt.fmt(d)}</text>`; });
      const r=Math.min(4, bw/2);
      for(let i=0;i<N;i++){
        const v=cfg.values[i], x=m.l+band*i+band/2-bw/2, yb=Y(0), yv=Y(v), h=Math.abs(yb-yv), rr=Math.min(r,h);
        let d;
        if(h<0.5) d=`M${x} ${yb} h${bw}`;
        else if(v>=0) d=`M${x} ${yb} V${yv+rr} Q${x} ${yv} ${x+rr} ${yv} H${x+bw-rr} Q${x+bw} ${yv} ${x+bw} ${yv+rr} V${yb} Z`;
        else d=`M${x} ${yb} V${yv-rr} Q${x} ${yv} ${x+rr} ${yv} H${x+bw-rr} Q${x+bw} ${yv} ${x+bw} ${yv-rr} V${yb} Z`;
        s+=`<path class="bar-actual" data-i="${i}" d="${d}"/><rect class="bar-hit" data-i="${i}" x="${(m.l+band*i).toFixed(1)}" y="${m.t}" width="${band.toFixed(1)}" height="${ph}" fill="transparent"/>`;
      }
      s+=`<line class="baseline" x1="${m.l}" x2="${W-m.r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/></svg>`;
      el.innerHTML=s;
      const tip=document.createElement('div'); tip.className='tip'; el.appendChild(tip);
      const svg=el.querySelector('svg');
      svg.querySelectorAll('.bar-hit').forEach(h=>{
        const i=+h.dataset.i, bar=svg.querySelector(`.bar-actual[data-i="${i}"]`);
        const on=()=>{
          bar.classList.add('hover'); tip.textContent='';
          const dt=document.createElement('div'); dt.className='t-date'; dt.textContent=fmtMonthLong(cfg.dates[i]); tip.appendChild(dt);
          const row=document.createElement('div'); row.className='t-row';
          const k=document.createElement('span'); k.className='t-key'; k.textContent=cfg.label;
          const b=document.createElement('b'); b.textContent=cfg.tipFmt(cfg.values[i]);
          row.appendChild(k); row.appendChild(b); tip.appendChild(row);
          if(cfg.notes && cfg.notes[i]){ const n=document.createElement('div'); n.className='t-note'; n.textContent=cfg.notes[i]; tip.appendChild(n); }
          const rc=svg.getBoundingClientRect(), sc=rc.width/W; tip.style.opacity=1;
          let left=(m.l+band*i+band)*sc+6; if(left+tip.offsetWidth>rc.width) left=(m.l+band*i)*sc-tip.offsetWidth-6;
          tip.style.left=Math.max(0,left)+'px'; tip.style.top=(m.t*sc)+'px';
        };
        const off=()=>{ bar.classList.remove('hover'); tip.style.opacity=0; };
        h.addEventListener('pointerenter', on); h.addEventListener('pointerdown', on); h.addEventListener('pointerleave', off);
      });
    };
  }

  // HTML horizontal bars with a zero line (handles negatives)
  function hbars(rows, opts){
    const vals = rows.map(r=>r.value);
    const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = (hi-lo)||1;
    const zero = (0-lo)/span*100;
    return `<div class="hbars">` + rows.map(r=>{
      const w = Math.abs(r.value)/span*100, left = r.value>=0 ? zero : zero-w;
      return `<div class="hb-row ${r.em?'em':''}">
        <span class="hb-name">${esc(r.label)}</span>
        <span class="hb-track"><span class="hb-bar ${r.value>=0?'pos':'neg'} c-${r.color||'actual'}" style="left:${left.toFixed(2)}%;width:${Math.max(w,0.6).toFixed(2)}%"></span>${lo<0?`<span class="hb-zero" style="left:${zero.toFixed(2)}%"></span>`:''}</span>
        <span class="hb-v">${esc(opts.fmt(r.value))}</span></div>`;
    }).join('') + `</div>`;
  }

  function segControl(id, options, active){
    return `<div class="seg" role="group" id="${id}">` + options.map(o=>`<button data-v="${o.v}" aria-pressed="${o.v===active}">${o.label}</button>`).join('') + `</div>`;
  }
  function bindSeg(id, onChange){
    const btns = document.querySelectorAll(`#${id} button`);
    btns.forEach(b=>b.addEventListener('click', ()=>{ btns.forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); onChange(b.dataset.v); }));
  }
  const pageFoot = () => `<div class="page-foot"><span>Personal research project · statistical estimates, not investment or policy advice · not affiliated with BLS, FRED or the Federal Reserve.</span><span>Data: BLS, U.S. Treasury &amp; University of Michigan via <a href="https://fred.stlouisfed.org/" target="_blank" rel="noopener">FRED</a></span></div>`;
  const pending = what => `<div class="empty">${esc(what)} will appear after the next automatic data update.</div>`;

  // ================= app =================
  async function main(){
    const app = document.getElementById('app');
    let cpiRaw, fcRaw, btRaw, errRaw, xRaw, arRaw, hzRaw, schRaw, bmRaw, bmErrRaw;
    try{
      [cpiRaw, fcRaw, btRaw, errRaw, xRaw, arRaw, hzRaw, schRaw, bmRaw, bmErrRaw] = await Promise.all([
        loadCSV('data/cpi_data.csv'),
        loadCSV('data/yoy_forecast.csv'),
        loadCSV('data/rolling_backtest.csv'),
        loadCSV('data/backtest_errors.csv', true),
        loadCSV('data/extra_series.csv', true),
        loadCSV('data/forecast_archive.csv', true),
        loadCSV('data/horizon_backtest.csv', true),
        loadCSV('data/cpi_release_schedule.csv', true),
        loadCSV('data/model_benchmark.csv', true),
        loadCSV('data/model_benchmark_errors.csv', true),
      ]);
    }catch(err){
      app.innerHTML = `<div class="error">Could not load data files — ${esc(err.message)}.<br>This page must be served over HTTP (e.g. GitHub Pages or <code>python -m http.server</code>).</div>`;
      return;
    }

    // ---------- headline CPI: complete monthly series ----------
    const raw = cpiRaw.map(r=>({date:parseDate(r.date), cpi:num(r.cpi)})).filter(r=>r.cpi!=null).sort((a,b)=>a.date-b.date);
    const data=[];
    for(let i=0;i<raw.length;i++){
      if(i>0){ const p=raw[i-1], c=raw[i], g=monthDiff(p.date,c.date); for(let k=1;k<g;k++) data.push({date:addMonths(p.date,k), cpi:p.cpi+(c.cpi-p.cpi)*k/g, interpolated:true}); }
      data.push(raw[i]);
    }
    data.forEach((d,i)=>{ d.mom = i>0 ? (d.cpi/data[i-1].cpi-1)*100 : null; d.yoy = i>=12 ? (d.cpi/data[i-12].cpi-1)*100 : null; });
    const yoyData = data.filter(d=>d.yoy!=null);
    const latest = data[data.length-1], prev = data[data.length-2];
    const cpiAt = new Map(data.map(d=>[d.date.getTime(), d]));
    // next scheduled BLS release (data/cpi_release_schedule.csv, from bls.gov)
    const now = new Date(), todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const nextRelease = schRaw.map(r=>({ref:parseDate(r.reference_month), date:parseDate(r.release_date)}))
      .filter(r=>r.ref>latest.date && r.date.getTime()>=todayUTC).sort((a,b)=>a.date-b.date)[0];
    const fmtDay = d => MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate();
    const nextText = nextRelease ? (nextRelease.date.getTime()===todayUTC ? 'today, 8:30 a.m. ET' : fmtDay(nextRelease.date)+', '+nextRelease.date.getUTCFullYear()) : null;
    document.getElementById('sideStatus').innerHTML = `<span class="row"><span class="dot"></span>Data through ${fmtMonth(latest.date)}</span>` + (nextText ? `<span class="sub">Next CPI release: ${nextText}</span>` : '');

    // ---------- forecast & backtest ----------
    const forecast = fcRaw.map(r=>({date:parseDate(r.date), mean:num(r.mean), lo:num(r.mean_ci_lower), hi:num(r.mean_ci_upper)})).filter(r=>r.mean!=null).sort((a,b)=>a.date-b.date);
    const next = forecast[0], last12 = forecast[forecast.length-1];
    const bt = btRaw.map(r=>({model:cleanModel(r.model), mae:num(r.mae), rmse:num(r.rmse)})).filter(r=>r.mae!=null);
    const naive = bt.find(r=>/naive/i.test(r.model));
    const model = bt.find(r=>r.model===MODEL_NAME) || bt.filter(r=>!/naive/i.test(r.model)).sort((a,b)=>a.rmse-b.rmse)[0];
    const modelLabel = (model ? model.model : MODEL_NAME).replace(/\s/g,'');
    const maeGain = (model && naive) ? (1 - model.mae/naive.mae)*100 : null;
    const errs = errRaw.map(r=>({date:parseDate(r.date), model:cleanModel(r.model), actual:num(r.actual), forecast:num(r.forecast), error:num(r.error), abs:num(r.abs_error)}));
    const errModel = model ? errs.filter(e=>e.model===model.model).sort((a,b)=>a.date-b.date) : [];
    const errNaive = errs.filter(e=>/naive/i.test(e.model)).sort((a,b)=>a.date-b.date);
    const hasErrors = errModel.length>0 && errNaive.length===errModel.length;

    // ---------- supporting series (monthly, aligned) ----------
    const X = (()=>{

      const rows = xRaw.map(r=>({date:parseDate(r.date), r})).sort((a,b)=>a.date-b.date);
      const dates = rows.map(x=>x.date);
      const cols = {};
      Object.keys(xRaw[0]).filter(k=>k!=='date').forEach(k=>{ cols[k] = fillInterior(rows.map(x=>num(x.r[k]))); });
      return {dates, cols, has:k=>!!cols[k] && lastIdx(cols[k])>=0};
    })();
    function seriesFrom(col, start){
      if(!X || !X.has(col)) return null;
      const v = X.cols[col]; const out=[];
      for(let i=0;i<X.dates.length;i++){ if(v[i]!=null && (!start || X.dates[i]>=start)) out.push({date:X.dates[i], v:v[i], i}); }
      return out;
    }
    function compYoY(col){
      if(!X || !X.has(col)) return null;
      const y = yoyOf(X.cols[col]);
      return X.dates.map((d,i)=>({date:d, v:y[i]})).filter(p=>p.v!=null);
    }

    // =============== page markup ===============
    const yoyChange = latest.yoy - prev.yoy, gap = latest.yoy - FED_TARGET;

      {key:'food', label:'Food'},
      {key:'energy', label:'Energy'},
      {key:'shelter', label:'Shelter'},
    ];
    const compLatest = COMPONENTS.map(c=>{ const s=compYoY(c.key); return s && s.length ? {...c, v:s[s.length-1].v, date:s[s.length-1].date, series:s} : null; }).filter(Boolean);

    app.innerHTML = `
      <!-- ================= OVERVIEW ================= -->
      <section class="page" id="page-overview" data-title="Overview">
        <div class="eyebrow"><span class="pill"><span class="dot"></span>Data through ${fmtMonthLong(latest.date)}</span>${nextText?`<span class="pill">Next CPI release: ${nextText}</span>`:''}<span>CPI-U, all items, seasonally adjusted</span></div>
        <h1>U.S. inflation is running at ${pct(latest.yoy)}, ${Math.abs(gap)<0.05 ? "right at the Fed's 2% target" : Math.abs(gap).toFixed(1)+" points "+(gap>0?"above":"below")+" the Fed's 2% target"}.</h1>
        <p class="lede">A statistical model (<b>${esc(modelLabel)}</b>) projects year-over-year CPI inflation of <b>${pct(next.mean)}</b> for ${fmtMonthLong(next.date)},
          with a 95% interval of ${pct(next.lo)} to ${pct(next.hi)}. Every forecast is checked against a naive benchmark in a rolling backtest. <a class="link-more" href="#findings">Read the key findings →</a></p>
        <div class="grid-4">
          <div class="kpi hero"><div class="kpi-label">Annual inflation (YoY)</div><div class="kpi-value num">${pct(latest.yoy)}</div>
            <div class="kpi-sub">${Math.abs(yoyChange)<0.05 ? 'Unchanged vs '+fmtMonth(prev.date) : `<span class="${yoyChange>0?'up-bad':'down-good'}">${pp(yoyChange)}</span> vs ${fmtMonth(prev.date)}`}</div></div>
          <div class="kpi"><div class="kpi-label">Monthly change (MoM)</div><div class="kpi-value num">${pct(latest.mom)}</div><div class="kpi-sub">${fmtMonth(latest.date)} vs ${fmtMonth(prev.date)}</div></div>
          <div class="kpi"><div class="kpi-label">Forecast, ${fmtMonth(next.date)}</div><div class="kpi-value num">${pct(next.mean)}</div><div class="kpi-sub">95% interval ${pct(next.lo)} – ${pct(next.hi)}</div></div>
          <div class="kpi"><div class="kpi-label">${maeGain!=null && maeGain<0 ? 'Higher error than naive' : 'Lower error than naive'}</div><div class="kpi-value num">${maeGain!=null ? Math.abs(maeGain).toFixed(0)+'%' : '—'}</div><div class="kpi-sub">Backtest MAE ${model?model.mae.toFixed(2):'—'} vs ${naive?naive.mae.toFixed(2):'—'} pp</div></div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="card-head">
            <div><p class="card-title">Year-over-year inflation and 12-month forecast</p><p class="card-sub">Shaded area is the 95% confidence interval; it widens as the horizon grows.</p></div>
            ${segControl('ovRange', [{v:'36',label:'3Y'},{v:'60',label:'5Y'},{v:'120',label:'10Y'},{v:'0',label:'All'}], '36')}
          </div>
          <div class="legend"><span><i class="key-line" style="background:var(--c-actual)"></i>Actual</span><span><i class="key-dash" style="border-color:var(--c-model)"></i>Forecast</span><span><i class="key-area" style="background:var(--c-model);opacity:.3"></i>95% interval</span></div>
          <div class="chart" id="ovChart"></div>
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="card">
            <div class="card-head"><p class="card-title">What's driving it</p><a class="link-more" href="#drivers">Details →</a></div>
            <p class="card-sub">Year-over-year change by component${compLatest.length?', '+fmtMonth(compLatest[0].date):''}.</p>
            ${compLatest.length ? hbars([{label:'All items', value:latest.yoy, color:'ink', em:true}].concat(compLatest.map(c=>({label:c.label, value:c.v}))), {fmt:v=>spct(v)}) : pending('Component data')}
          </div>
          <div class="card">
            <div class="card-head"><p class="card-title">How accurate is the model?</p><a class="link-more" href="#track-record">Track record →</a></div>
            <p class="card-sub">Average one-month-ahead miss over the last ${hasErrors?errModel.length:24} months, in percentage points.</p>
            ${model && naive ? hbars([{label:modelLabel, value:model.mae, color:'model', em:true},{label:'Naive benchmark', value:naive.mae, color:'ref'}], {fmt:v=>v.toFixed(2)+' pp'}) : ''}
            <p class="card-sub" style="margin:12px 0 0">The naive benchmark assumes next month's inflation equals this month's.</p>
          </div>
        </div>
        ${pageFoot()}
      </section>

      <!-- ================= FINDINGS ================= -->
      <section class="page" id="page-findings" data-title="Key findings">

        <p class="lede">What four years of out-of-sample testing says about forecasting U.S. inflation. Every number on this page is recomputed automatically when new CPI data arrives.</p>

        ${pageFoot()}
      </section>

      <section class="page" id="page-forecast" data-title="Forecast">
        <h1 class="page-title">12-month forecast</h1>
        <p class="lede">Year-over-year CPI inflation projected by ${esc(modelLabel)} from data through ${fmtMonthLong(latest.date)}. The model expects inflation of <b>${pct(last12.mean)}</b> by ${fmtMonthLong(last12.date)}.</p>
        <div class="card">
          <div class="legend"><span><i class="key-line" style="background:var(--c-actual)"></i>Actual</span><span><i class="key-dash" style="border-color:var(--c-model)"></i>Forecast</span><span><i class="key-area" style="background:var(--c-model);opacity:.3"></i>95% interval</span></div>

              <tbody>${forecast.map(r=>`<tr><td>${fmtMonth(r.date)}</td><td class="r">${pct(r.mean)}</td><td class="r muted">${pct(r.lo)} – ${pct(r.hi)}</td></tr>`).join('')}</tbody></table>

              ${(last12.hi-last12.lo).toFixed(1)} points (${pct(last12.lo)} to ${pct(last12.hi)}): the model is honest that it cannot see a year ahead precisely.</p>

          <p class="card-title">Model comparison</p>

        <p class="sec-sub">Four models forecast the same months, one month ahead, each re-fit only on data available at the time. The Diebold-Mariano test asks whether each model's advantage over the naive benchmark is larger than chance.</p>

        <h1 class="page-title">Everyday prices</h1>

      <section class="page" id="page-history" data-title="History">
        <h1 class="page-title">Eight decades of inflation</h1>

        <div class="card">

              <tbody>${data.slice(-36).reverse().map(r=>`<tr><td>${fmtMonth(r.date)}${r.interpolated?' <span class="tag">interpolated</span>':''}</td><td class="r">${r.cpi.toFixed(3)}</td><td class="r">${pct(r.mom,2)}</td><td class="r">${pct(r.yoy,2)}</td></tr>`).join('')}</tbody>

        <div class="card">
          <p class="card-title">Purchasing power calculator</p>
          <p class="card-sub">Uses the annual average CPI for past years and the latest month for the current year.</p>
          <div class="calc-inputs">
            <label class="field">Amount ($)<input id="calcAmt" type="number" min="0" step="1" value="100" inputmode="decimal"></label>
            <label class="field">From<select id="calcFrom"></select></label>
            <label class="field">To<select id="calcTo"></select></label>
          </div>
          <div class="calc-result" id="calcResult"></div>

          <div class="chart" id="calcChart" style="margin-top:8px"></div>
        </div>
        <h2>Are wages keeping up?</h2>
        <p class="sec-sub">Average hourly earnings of production and nonsupervisory workers versus consumer prices, year-over-year.</p>
