[project]
name = "us-inflation-forecast"
version = "1.0.0"
description = "U.S. CPI inflation tracker with a 12-month ARIMA forecast, model benchmarks and a public backtest track record."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["data_utils", "archive_forecast", "download_extra", "horizon_backtest", "model_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
